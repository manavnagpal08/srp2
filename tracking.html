<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Track Your Order | Shree Ram Packers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 0;
    }

    header {
        background: white;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    header img {
        height: 50px;
    }

    nav {
        display: flex;
        gap: 20px;
    }

    nav a {
        text-decoration: none;
        color: #0d47a1;
        font-weight: 600;
        position: relative;
    }

    nav a:hover {
        color: #d60000;
    }

    .container {
        max-width: 650px;
        margin: 40px auto;
        padding: 25px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        text-align: center;
    }

    h2 {
        font-weight: 600;
        color: #0d47a1;
    }

    #orderInput {
        width: 90%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #bbb;
        font-size: 16px;
        margin-bottom: 15px;
    }

    #trackBtn {
        background: #0d47a1;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
    }

    #trackBtn:hover {
        background: #08306b;
    }

    .status-box {
        margin-top: 30px;
        text-align: left;
    }

    .stage {
        padding: 15px;
        border-left: 5px solid #ccc;
        margin-bottom: 15px;
        background: #f9f9f9;
        border-radius: 8px;
    }

    .completed {
        border-left-color: #28a745 !important;
        background: #e8fbe8 !important;
    }

    .active {
        border-left-color: #ffc107 !important;
        background: #fff7e6 !important;
    }

    .circle {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        float: right;
        margin-top: 4px;
    }

    .done { background: #28a745; }
    .in-progress { background: #ffc107; }
    .pending { background: #aaa; }
</style>
</head>

<body>

<header>
    <img src="logo.png" alt="Logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="markets-products.html">Products</a>
        <a href="contact.html">Contact</a>
        <a href="tracking.html" style="color:#d60000;">Track Order</a>
    </nav>
</header>

<div class="container">
    <h2>📦 Track Your Order</h2>
    <p>Enter your Order ID or scan QR code</p>

    <input type="text" id="orderInput" placeholder="Enter Order ID (e.g., SRP0123)">
    <button id="trackBtn" onclick="fetchOrder()">Track Order</button>

    <div id="status-box" class="status-box"></div>
</div>


<script>
    https://osm-78f8b-default-rtdb.firebaseio.com/orders.json


    // ------------ Read Order ID from URL (?id=SRP001) -------------
    const urlParams = new URLSearchParams(window.location.search);
    const qrOrderId = urlParams.get("id");

    if (qrOrderId) {
        document.getElementById("orderInput").value = qrOrderId;
        fetchOrder();
    }

    // ------------- Fetch Order From Firebase -----------------
    async function fetchOrder() {
        let orderId = document.getElementById("orderInput").value.trim();

        if (!orderId) {
            alert("Please enter valid Order ID");
            return;
        }

        document.getElementById("status-box").innerHTML =
            "<p><b>Fetching latest status...</b></p>";

        try {
            const res = await fetch(FIREBASE_URL);
            const data = await res.json();

            let found = null;
            for (let key in data) {
                if (data[key].order_id === orderId) {
                    found = data[key];
                    break;
                }
            }

            if (!found) {
                document.getElementById("status-box").innerHTML =
                    "<h3 style='color:red;'>❌ Order not found</h3>";
                return;
            }

            renderStatus(found);

        } catch (err) {
            document.getElementById("status-box").innerHTML =
                "<h3 style='color:red;'>⚠ Unable to fetch data</h3>";
        }
    }

    // ------------- Render Nice UI Timeline -----------------
    function renderStatus(o) {
        const stages = ["Design", "Printing", "DieCut", "Assembly", "Packing", "Completed"];

        let html = `
            <h3>Order: <b>${o.order_id}</b></h3>
            <p><b>Customer:</b> ${o.customer}</p>
            <p><b>Item:</b> ${o.item}</p>
            <hr>
            <h3>Status Timeline</h3>
        `;

        stages.forEach(stage => {
            let status = "pending";
            let css = "";

            if (o.stage === stage) {
                status = "in-progress";
                css = "active";
            }

            if (
                (stage === "Design" && o.design_completed_at) ||
                (stage === "Printing" && o.printing_completed_at) ||
                (stage === "DieCut" && o.diecut_completed_at) ||
                (stage === "Assembly" && o.assembly_completed_at) ||
                (stage === "Packing" && o.packing_completed_at) ||
                (stage === "Completed" && o.stage === "Completed")
            ) {
                status = "done";
                css = "completed";
            }

            html += `
                <div class="stage ${css}">
                    <b>${stage}</b>
                    <div class="circle ${status}"></div>
                </div>
            `;
        });

        document.getElementById("status-box").innerHTML = html;
    }
</script>

</body>
</html>
