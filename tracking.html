<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Tracking – Shree Ram Packers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fa;
  padding: 20px;
}
.container {
  max-width: 600px;
  margin: auto;
  padding: 25px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}
input {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-top: 10px;
}
button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  background: #0d47a1;
  border: none;
  color: white;
  border-radius: 8px;
  font-size: 16px;
}
#result {
  margin-top: 20px;
  padding: 18px;
  background: #e3f2fd;
  border-radius: 8px;
}
</style>

</head>
<body>

<div class="container">
  <h2>📦 Track Your Order</h2>
  <p>Enter order ID or scan QR code.</p>

  <input id="orderInput" placeholder="Enter Order ID (e.g., SRP015)">
  <button onclick="trackOrder()">Track</button>

  <div id="result"></div>
</div>

<script type="module">

// ------------------------------------
// FIREBASE IMPORTS
// ------------------------------------
import { initializeApp } 
from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";

import { getDatabase, ref, get }
from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";


// ------------------------------------
// FIREBASE CONFIG
// ------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyC6dSHzQ5kvfDSDcLNvRl-svNf5E2Mrmuk",
  authDomain: "omss-2ccc6.firebaseapp.com",

  // 🔥 FIX THIS PART WITH EXACT URL FROM FIREBASE
  databaseURL: "https://omss-2ccc6-default-rtdb.firebaseio.com/",

  projectId: "omss-2ccc6",
  storageBucket: "omss-2ccc6.firebasestorage.app",
  messagingSenderId: "24897633074",
  appId: "1:24897633074:web:ddbf44965e91b17a1db52b"
};


// ------------------------------------
// INITIALIZE FIREBASE
// ------------------------------------
const app = initializeApp(firebaseConfig);

// Long polling fix for iPhone + weak networks
const db = getDatabase(app, {
  experimentalForceLongPolling: true,
  experimentalAutoDetectLongPolling: true
});


// ------------------------------------
// AUTO READ ORDER ID FROM URL
// ------------------------------------
const params = new URLSearchParams(window.location.search);
const autoID = params.get("id");

if (autoID) {
  document.getElementById("orderInput").value = autoID;
  setTimeout(() => trackOrder(), 200);
}


// ------------------------------------
// TRACK ORDER FUNCTION
// ------------------------------------
async function trackOrder() {
  const oid = document.getElementById("orderInput").value.trim();
  const out = document.getElementById("result");

  if (!oid) {
    out.innerHTML = "<p style='color:red;'>Enter order ID.</p>";
    return;
  }

  out.innerHTML = "⏳ Loading...";

  try {
    const snap = await get(ref(db, "orders"));

    if (!snap.exists()) {
      out.innerHTML = "<p style='color:red;'>No orders found.</p>";
      return;
    }

    let found = null;

    snap.forEach(child => {
      if (child.val().order_id === oid) found = child.val();
    });

    if (!found) {
      out.innerHTML = "<p style='color:red;'>Order not found.</p>";
      return;
    }

    out.innerHTML = `
      <h3>Order Details</h3>
      <p><b>Order ID:</b> ${found.order_id}</p>
      <p><b>Customer:</b> ${found.customer}</p>
      <p><b>Product:</b> ${found.item}</p>
      <p><b>Quantity:</b> ${found.qty}</p>
      <p><b>Status:</b> ${found.stage}</p>
      <p><b>Priority:</b> ${found.priority}</p>
    `;

  } catch (e) {
    out.innerHTML = "<p style='color:red;'>Error fetching order.</p>";
    console.error(e);
  }
}


// ------------------------------------
// EXPOSE FUNCTION TO GLOBAL WINDOW
// ------------------------------------
window.trackOrder = trackOrder;

</script>

</body>
</html>
