<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Track Your Order – Shree Ram Packers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body { font-family: 'Poppins', sans-serif; background:#f8f9fc; margin:0; padding:0; }

    header {
        background:white;
        padding:15px 30px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        box-shadow:0 2px 8px rgba(0,0,0,0.05);
        position:sticky; top:0; z-index:1000;
    }

    nav { display:flex; gap:20px; align-items:center; }

    nav a {
        text-decoration:none;
        color:#0d47a1;
        font-weight:600;
        font-size:16px;
        position:relative;
    }

    .container {
        max-width:700px;
        margin:40px auto;
        background:white;
        padding:30px;
        border-radius:12px;
        box-shadow:0 6px 20px rgba(0,0,0,0.08);
        text-align:center;
    }

    input[type=text] {
        width:100%;
        padding:12px;
        font-size:16px;
        border:1px solid #ccc;
        border-radius:8px;
        margin-bottom:15px;
    }

    button {
        background:#0d47a1;
        color:white;
        padding:12px 22px;
        border:none;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
        width:100%;
    }

    .result-box {
        margin-top:25px;
        text-align:left;
        background:#f2f6ff;
        padding:20px;
        border-radius:10px;
        border-left:5px solid #0d47a1;
    }

    .label { font-weight:600; color:#0d47a1; }
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <img src="logo.png" height="50">
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="tracking.html" style="color:#d60000;">Track Order</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<!-- BODY -->
<div class="container">
    <h2>📦 Track Your Order</h2>
    <p>Enter your Order ID or scan the QR code.</p>

    <input type="text" id="orderInput" placeholder="Enter Order ID e.g. SRP005">

    <button onclick="fetchOrder()">🔍 Track Order</button>

    <div id="result"></div>
</div>

<!-- FIREBASE SDK 9 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyC6dSHzQ5kvfDSDcLNvRl-svNf5E2Mrmuk",
        authDomain: "omss-2ccc6.firebaseapp.com",
        databaseURL: "https://omss-2ccc6-default-rtdb.firebaseio.com",
        projectId: "omss-2ccc6",
        storageBucket: "omss-2ccc6.firebasestorage.app",
        messagingSenderId: "24897633074",
        appId: "1:24897633074:web:ddbf44965e91b17a1db52b",
        measurementId: "G-D1GBGQQJS2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Expose function globally
    window.fetchOrder = async function () {
        const orderID = document.getElementById("orderInput").value.trim();
        const resultBox = document.getElementById("result");

        if (!orderID) {
            resultBox.innerHTML = "<p style='color:red;'>❌ Please enter a valid Order ID.</p>";
            return;
        }

        resultBox.innerHTML = "<p>⏳ Loading...</p>";

        const dbRef = ref(db);

        try {
            const snapshot = await get(child(dbRef, "orders"));
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // Search for order in Firebase values
                let found = null;
                Object.values(data).forEach(o => {
                    if (o.order_id === orderID) found = o;
                });

                if (!found) {
                    resultBox.innerHTML = "<p style='color:red;'>❌ Order not found.</p>";
                    return;
                }

                // SUCCESS → Render Beautiful Card
                resultBox.innerHTML = `
                    <div class="result-box">
                        <p><span class="label">Order ID:</span> ${found.order_id}</p>
                        <p><span class="label">Customer:</span> ${found.customer}</p>
                        <p><span class="label">Item:</span> ${found.item}</p>
                        <p><span class="label">Quantity:</span> ${found.qty}</p>
                        <p><span class="label">Priority:</span> ${found.priority}</p>
                        <p><span class="label">Stage:</span> ${found.stage}</p>
                        <p><span class="label">Received:</span> ${found.received}</p>
                        <p><span class="label">Due Date:</span> ${found.due}</p>
                    </div>
                `;
            }
        } 
        catch (err) {
            resultBox.innerHTML = "<p style='color:red;'>⚠ Firebase error:</p>" + err;
        }
    }
</script>

</body>
</html>
