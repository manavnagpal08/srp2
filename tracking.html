<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Tracking – Shree Ram Packers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: "Poppins", sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: 40px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
        font-weight: 600;
        color: #0d47a1;
    }

    input {
        width: 90%;
        padding: 14px;
        font-size: 16px;
        border: 2px solid #d0d0d0;
        border-radius: 8px;
        margin-top: 10px;
    }

    button {
        background: #0d47a1;
        color: white;
        padding: 14px 20px;
        font-size: 16px;
        margin-top: 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 95%;
    }

    button:hover {
        background: #08306b;
    }

    .result-box {
        margin-top: 25px;
        padding: 20px;
        background: #f0f4ff;
        border-left: 5px solid #0d47a1;
        border-radius: 10px;
        text-align: left;
    }

    .error {
        color: red;
        margin-top: 15px;
        font-weight: 600;
    }

</style>
</head>

<body>

<div class="container">
    <h1>📦 Track Your Order</h1>
    <p>Enter your Order ID to check live order status.</p>

    <input id="orderInput" placeholder="Enter Order ID (e.g., SRP-00123)">
    <button onclick="trackOrder()">Track Order</button>

    <div id="output"></div>
</div>

<!-- FIREBASE SDK -->
<script type="module">

    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC6dSHzQ5kvfDSDcLNvRl-svNf5E2Mrmuk",
      authDomain: "omss-2ccc6.firebaseapp.com",
      databaseURL: "https://omss-2ccc6-default-rtdb.firebaseio.com",
      projectId: "omss-2ccc6",
      storageBucket: "omss-2ccc6.firebasestorage.app",
      messagingSenderId: "24897633074",
      appId: "1:24897633074:web:ddbf44965e91b17a1db52b",
      measurementId: "G-D1GBGQQJS2"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // -------- TRACK ORDER FUNCTION ----------
    window.trackOrder = async function() {
        const orderId = document.getElementById("orderInput").value.trim();
        const output = document.getElementById("output");

        if (!orderId) {
            output.innerHTML = `<p class='error'>❌ Please enter a valid Order ID.</p>`;
            return;
        }

        output.innerHTML = "<p>⏳ Fetching order...</p>";

        try {
            const ordersRef = ref(db, "orders");
            const snapshot = await get(ordersRef);

            if (!snapshot.exists()) {
                output.innerHTML = `<p class='error'>❌ No orders found in system.</p>`;
                return;
            }

            let found = false;
            snapshot.forEach(child => {
                const data = child.val();
                if (data.order_id === orderId) {
                    found = true;
                    displayOrder(data);
                }
            });

            if (!found) {
                output.innerHTML = `<p class='error'>❌ Order ID not found. Check and try again.</p>`;
            }

        } catch (err) {
            output.innerHTML = `<p class='error'>⚠ Error: ${err}</p>`;
        }
    }

    // -------- DISPLAY ORDER DETAILS ----------
    function displayOrder(order) {
        const output = document.getElementById("output");

        output.innerHTML = `
            <div class="result-box">
                <h3>Order Details</h3>
                <p><strong>Order ID:</strong> ${order.order_id}</p>
                <p><strong>Customer:</strong> ${order.customer}</p>
                <p><strong>Product:</strong> ${order.item}</p>
                <p><strong>Quantity:</strong> ${order.qty}</p>
                <p><strong>Stage:</strong> ${order.stage}</p>
                <p><strong>Priority:</strong> ${order.priority}</p>
                <p><strong>Received:</strong> ${order.received}</p>
                <p><strong>Due Date:</strong> ${order.due}</p>
            </div>
        `;
    }

</script>

</body>
</html>
