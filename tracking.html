<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Tracking - Shree Ram Packers</title>

<style>
    /* ---------------- HEADER STYLES ---------------- */
    header {
      background: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      position: relative;
    }
    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      background: #0d47a1;
      bottom: -4px;
      left: 0;
      transition: 0.3s;
    }
    nav a:hover::after {
      width: 100%;
    }
    .contact-btn {
      background: #d60000;
      color: white;
      padding: 8px 14px;
      border-radius: 5px;
    }
    .dropdown {
      position: relative;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      min-width: 200px;
      top: 100%;
      left: 0;
      z-index: 10;
    }
    .dropdown-content a {
      display: block;
      padding: 10px 16px;
      text-decoration: none;
      color: #333;
    }
    .dropdown-content a:hover {
      background-color: #f5f5f5;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* ---------------- TRACKING STYLES ---------------- */
    body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        margin: 0; padding: 0;
    }
    .container {
        max-width: 600px;
        margin: 40px auto;
        padding: 25px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
        text-align: center;
        color: #2A4DFF;
        margin-bottom: 20px;
    }
    .status {
        padding: 12px;
        background: #eef2ff;
        border-left: 4px solid #2A4DFF;
        margin-bottom: 15px;
    }
    .label {
        font-weight: bold;
        margin-top: 10px;
    }
    .value {
        padding: 8px 12px;
        background: #f0f0f0;
        border-radius: 6px;
        margin-bottom: 12px;
    }
</style>
</head>

<body>

<!-- ---------------- HEADER INSERTED HERE ---------------- -->
<header>
  <div class="logo">
    <img src="assets/logo.png" alt="Shree Ram Packers" height="50" />
  </div>

  <nav>
    <a href="index.html">Home</a>

    <div class="dropdown">
      <a href="#">About ▾</a>
      <div class="dropdown-content">
        <a href="company-background.html">Company Background</a>
        <a href="sustainability.html">Sustainability</a>
        <a href="certifications.html">Quality & Certifications</a>
      </div>
    </div>

    <a href="#">Innovation and Technology</a>

    <div class="dropdown">
      <a href="#">Markets & Products ▾</a>
      <div class="dropdown-content">
        <a href="markets-products.html">Markets</a>
        <a href="product-paper-bags.html">Paper Bags</a>
        <a href="product-packaging-boxes.html">Packaging Boxes</a>
      </div>
    </div>

    <a href="locations.html">Locations</a>
    <a href="contact.html" class="contact-btn">Contact</a>
  </nav>
</header>


<!-- ---------------- TRACKING BODY ---------------- -->
<div class="container">
    <h1>📦 Track Your Order</h1>

    <div id="loading">Loading order details...</div>

    <div id="content" style="display:none;">

        <div class="status" id="statusBox"></div>

        <div class="label">Order ID</div>
        <div class="value" id="order_id"></div>

        <div class="label">Customer</div>
        <div class="value" id="customer"></div>

        <div class="label">Item</div>
        <div class="value" id="item"></div>

        <div class="label">Quantity</div>
        <div class="value" id="qty"></div>

        <div class="label">Current Stage</div>
        <div class="value" id="stage"></div>

        <div class="label">Next Stage</div>
        <div class="value" id="next_stage"></div>

        <div class="label">Last Updated</div>
        <div class="value" id="updated"></div>
    </div>
</div>


<!-- ---------------- SCRIPT ---------------- -->
<script>
    const FIREBASE_URL = "https://YOUR-FIREBASE.firebaseio.com/orders.json";

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order_id");

    if (!orderId) {
        document.getElementById("loading").innerHTML = "❌ Invalid tracking link.";
    } else {
        fetch(FIREBASE_URL)
            .then(res => res.json())
            .then(data => {
                const orders = Object.values(data);
                const order = orders.find(o => o.order_id === orderId);

                if (!order) {
                    document.getElementById("loading").innerHTML = "❌ Order not found.";
                    return;
                }

                document.getElementById("loading").style.display = "none";
                document.getElementById("content").style.display = "block";

                document.getElementById("order_id").innerText = order.order_id;
                document.getElementById("customer").innerText = order.customer;
                document.getElementById("item").innerText = order.item;
                document.getElementById("qty").innerText = order.qty;
                document.getElementById("stage").innerText = order.stage;
                document.getElementById("next_stage").innerText = order.next_after_printing || "N/A";
                document.getElementById("updated").innerText = new Date().toLocaleString();

                document.getElementById("statusBox").innerHTML =
                    `Current Status: <b>${order.stage}</b>`;
            });
    }
</script>

</body>
</html>
