<!DOCTYPE html>
<html>
<head>
    <title>Enable Admin Notifications</title>
</head>
<body style="font-family:Arial;padding:30px;">

<h2>🔔 Enable Admin Notifications</h2>
<p>This device will receive updates when any order is completed/updated.</p>

<button id="enableBtn"
    style="padding:12px 20px;font-size:16px;background:#1976d2;color:white;border:none;border-radius:6px;cursor:pointer;">
    Enable Notifications
</button>

<p id="status" style="margin-top:20px;color:green;"></p>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
// SAME CONFIG AS SERVICE WORKER
firebase.initializeApp({
    apiKey: "AIzaSyC6dSHzQ5kvfDSDcLNvRl-svNf5E2Mrmuk",
    authDomain: "omss-2ccc6.firebaseapp.com",
    databaseURL: "https://omss-2ccc6-default-rtdb.firebaseio.com/",
    projectId: "omss-2ccc6",
    storageBucket: "omss-2ccc6.firebasestorage.app",
    messagingSenderId: "24897633074",
    appId: "1:24897633074:web:ddbf44965e91b17a1db52b"
});

const messaging = firebase.messaging();
const db = firebase.database();

document.getElementById("enableBtn").onclick = async () => {
    try {
        console.log("Starting notification enablement process...");

        // 1️⃣ Ask notification permission
        console.log("1️⃣ Requesting notification permission...");
        const permission = await Notification.requestPermission();
        
        if (permission !== "granted") {
            document.getElementById("status").innerHTML = "❌ Permission denied";
            console.log("Permission denied by the user.");
            return;
        }
        console.log("✅ Notification permission granted.");

        // 2️⃣ Get FCM token (COMPAT)
        console.log("2️⃣ Getting FCM token...");
        const token = await messaging.getToken({
            vapidKey: "BNTK8a4dB3TlX0-1mI1tL_6kW-zGvYcOQ8sBq9S5MOmQF2kPELkWfdlZpJmWOxUv1GUuXuONp1MBvOicj9h5QKs"
        });
        
        if (token) {
            console.log("✅ FCM Token received:", token);
        } else {
            console.warn("FCM Token was null or undefined.");
            document.getElementById("status").innerHTML = "❌ Error: Could not retrieve FCM Token.";
            return;
        }

        // 3️⃣ Save to Firebase Realtime Database
        console.log("3️⃣ Saving token to Firebase Realtime Database...");
        await db.ref("admin_fcm_token").set(token);

        console.log("✅ Token successfully saved to DB.");
        document.getElementById("status").innerHTML = "✅ Notifications Enabled Successfully!";

    } catch (err) {
        // Enhanced Error Handling
        console.error("❌ An error occurred during the process:", err);
        document.getElementById("status").innerHTML = `❌ Error enabling notifications. Check console for details: **${err.message || err}**`;
    }
};
</script>

</body>
</html>
