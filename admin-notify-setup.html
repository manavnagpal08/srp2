<!DOCTYPE html>
<html>
<head>
    <title>Enable Admin Notifications</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/bag.jpg">
</head>

<body style="font-family:Arial;padding:30px;">

<h2>🔔 Enable Admin Notifications</h2>
<p>This device (Admin) will receive alerts when any order is created or completed.</p>

<button id="enableBtn"
    style="padding:12px 20px;font-size:16px;background:#1976d2;color:white;border:none;border-radius:6px;cursor:pointer;">
    Enable Notifications
</button>

<p id="status" style="margin-top:20px;color:green;"></p>

<script type="module">

// 🟢 Register Service Worker FIRST
navigator.serviceWorker.register("/firebase-messaging-sw.js")
.then(() => console.log("Service Worker Registered"))
.catch(err => console.error("SW registration failed", err));

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC6dSHzQ5kvfDSDcLNvRl-svNf5E2Mrmuk",
    authDomain: "omss-2ccc6.firebaseapp.com",
    databaseURL: "https://omss-2ccc6-default-rtdb.firebaseio.com/",
    projectId: "omss-2ccc6",
    storageBucket: "omss-2ccc6.firebasestorage.app",
    messagingSenderId: "24897633074",
    appId: "1:24897633074:web:ddbf44965e91b17a1db52b"
};

const app = initializeApp(firebaseConfig);
const messaging = getMessaging(app);
const database = getDatabase(app);

document.getElementById("enableBtn").onclick = async () => {
    try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
            document.getElementById("status").innerHTML = "❌ Permission denied";
            return;
        }

        const token = await getToken(messaging, {
            vapidKey: "BNTK8a4dB3TlX0-1mI1tL_6kW-zGvYcOQ8sBq9S5MOmQF2kPELkWfdlZpJmWOxUv1GUuXuONp1MBvOicj9h5QKs",
            serviceWorkerRegistration: await navigator.serviceWorker.getRegistration()
        });

        await set(ref(database, "admin_fcm_token"), token);

        document.getElementById("status").innerHTML = "✅ Notifications Enabled Successfully!";
    } catch (err) {
        console.error(err);
        document.getElementById("status").innerHTML = "❌ Error enabling notifications";
    }
};
</script>

</body>
</html>
